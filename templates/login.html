{% extends "base.html" %}
{% set active = 'login' %}
{% block title %}Log in · RentWise{% endblock %}

{% block content %}
  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subhead">Log in to save properties, schedule visits, and more.</p>

      <div id="auth-error" class="auth-error"></div>

      <form id="login-form" class="auth-form">
        <div class="field">
          <label for="l-email">Email</label>
          <input id="l-email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="l-password">Password</label>
          <input id="l-password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <button type="submit">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/js/login.js"></script>
{% endblock %}
